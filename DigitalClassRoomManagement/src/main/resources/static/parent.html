<!DOCTYPE html>
<html>
<head>
    <title>Parent Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        body { font-family: Arial; margin: 20px; }
        #log { border: 1px solid #ccc; height: 250px; overflow-y: auto; padding: 10px; }
        input, button { margin-top: 6px; padding: 5px; }
    </style>
</head>

<body>

<h2>Parent Chat</h2>

<label>Parent ID:</label>
<input id="parentId" value="1"><br>

<label>Teacher ID:</label>
<input id="teacherId" value="1"><br>

<button onclick="connect()">Connect</button>

<hr>

<input id="message" placeholder="Type message">
<button onclick="sendMessage()">Send</button>

<hr>

<h3>Messages</h3>
<pre id="log"></pre>

<script>
    let stompClient = null;

    function connect() {
        const parentId = document.getElementById("parentId").value;
        const teacherId = document.getElementById("teacherId").value;

        // 1️⃣ Load history
        fetch(`/api/chat/parent-teacher?teacherId=${teacherId}&parentId=${parentId}`)
            .then(res => res.json())
            .then(messages => {
                const log = document.getElementById("log");
                log.innerHTML = "";
                messages.forEach(m => {
                    log.innerHTML += `${m.sender}: ${m.message}\n`;
                });
            });

        // 2️⃣ Mark messages as read
        fetch(`/api/chat/parent/open?teacherId=${teacherId}&parentId=${parentId}`, {
    method: "POST"
});


        // 3️⃣ WebSocket connect
        const socket = new SockJS("http://localhost:9090/chat");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, () => {
            console.log("Parent connected");

            stompClient.subscribe(
                "/topic/chat/parent/" + parentId,
                (msg) => {
                    const data = JSON.parse(msg.body);
                    document.getElementById("log").innerHTML +=
                        `${data.sender}: ${data.message}\n`;
                }
            );
        });
    }

    function sendMessage() {
        if (!stompClient) {
            alert("Connect first");
            return;
        }

        const parentId = document.getElementById("parentId").value;
        const teacherId = document.getElementById("teacherId").value;
        const message = document.getElementById("message").value.trim();

        if (!message) {
            alert("Message cannot be empty");
            return;
        }

        stompClient.send(
            "/app/chat/send",
            { "content-type": "application/json" },
            JSON.stringify({
                parentId,
                teacherId,
                sender: "PARENT",
                message
            })
        );

        document.getElementById("message").value = "";
    }
</script>

</body>
</html>
