<!DOCTYPE html>
<html>
<head>
    <title>Student Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        body { font-family: Arial; margin: 20px; }
        #log { border: 1px solid #ccc; height: 250px; overflow-y: auto; padding: 10px; }
        input, button { margin-top: 6px; padding: 5px; }
    </style>
</head>

<body>

<h2>Student Chat</h2>

<label>Student Reg ID:</label>
<input id="studentRegId" value="1"><br>

<label>Teacher ID:</label>
<input id="teacherId" value="1"><br>

<button onclick="connect()">Connect</button>

<hr>

<input id="message" placeholder="Type message">
<button onclick="send()">Send</button>

<hr>

<h3>Messages</h3>
<pre id="log"></pre>

<script>
    let stompClient = null;

    function connect() {
        const studentRegId = document.getElementById("studentRegId").value;
        const teacherId = document.getElementById("teacherId").value;
        const log = document.getElementById("log");

        // 1️⃣ LOAD HISTORY
        fetch(`/api/chat/student-teacher?teacherId=${teacherId}&studentRegId=${studentRegId}`)
            .then(res => res.json())
            .then(messages => {
                log.innerHTML = "";
                messages.forEach(m => {
                    log.innerHTML += `${m.sender}: ${m.message}\n`;
                });
            });

        // 2️⃣ MARK AS READ (FIXED)
        fetch(`/api/chat/student/open?teacherId=${teacherId}&studentRegId=${studentRegId}`, {
            method: "POST"
        });

        // 3️⃣ WEBSOCKET
        const socket = new SockJS("http://localhost:9090/chat");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, () => {
            stompClient.subscribe(
                "/topic/chat/student/" + studentRegId,
                (msg) => {
                    const data = JSON.parse(msg.body);
                    log.innerHTML += `${data.sender}: ${data.message}\n`;
                }
            );
        });
    }

 function send() {
    const studentRegId = document.getElementById("studentRegId").value;
    const teacherId = document.getElementById("teacherId").value;
    const message = document.getElementById("message").value.trim();

    if (!message) return;

    // ✅ SHOW MESSAGE IMMEDIATELY
    document.getElementById("log").innerHTML += `STUDENT: ${message}\n`;

    stompClient.send(
        "/app/chat/send",
        { "content-type": "application/json" },
        JSON.stringify({
            studentRegId,
            teacherId,
            sender: "STUDENT",
            message
        })
    );

    document.getElementById("message").value = "";
}

</script>

</body>
</html>
