spring.application.name=DigitalClassRoomManagement

spring.datasource.url=jdbc:mysql://localhost:3306/digitalClassManagement?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root

# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver   # optional, auto-detect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect # optional, auto

spring.datasource.password=Ankit2003#
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Dev Error Visibility (turn these off in prod) ----
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
# server.error.include-stacktrace=always

# ---- Logging ----
logging.level.root=INFO
logging.level.com.DigitalClassRoomManagement=DEBUG

# ---- Upload limits ----
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
